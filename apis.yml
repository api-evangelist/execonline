aid: execonline
name: ExecOnline
description: 'ExecOnline is a New York-based B2B leadership-development company that
  partners with top business schools — including UC Berkeley Executive Education, Chicago
  Booth, Columbia, UVA Darden, Tuck at Dartmouth, Duke CE, IMD, Ivey, MIT Sloan, Stanford
  GSB, Wharton and Yale — to deliver executive education online at enterprise scale.
  Founded in 2012, it blends professor-led courses, one-on-one and group coaching, cohort
  sessions and on-demand content into a single connected learning journey, and layers
  an insights-and-reporting platform on top so enterprises can align learning outcomes
  to business goals. ExecOnline acquired Teamraderie in 2026. Its learning platform is
  a credentialed, customer-only web application at platform.execonline.com; ExecOnline
  publishes no public developer portal, API documentation, or machine-readable API
  contract, and no public API surface was discoverable as of this profile.'
