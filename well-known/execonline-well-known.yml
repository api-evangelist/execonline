summary: |
  ExecOnline publishes NO first-party /.well-known/ discovery surface. Every well-known
  path returned 404 on the marketing site (www), the ExecConnect community site
  (connect), and both credentialed learning-platform hosts (platform, app).

  Two /.well-known/security.txt documents DO return 200 on execonline.com subdomains —
  but both are served by the SaaS vendor that hosts the subdomain, not by ExecOnline,
  and both declare a Canonical: pointing back at the vendor's own domain. They are
  recorded here verbatim as observed fact and attributed to their real owner. Neither
  is an ExecOnline vulnerability-disclosure program, so this repo carries NO SecurityTxt
  and NO Security pointer in apis.yml.

  api.execonline.com resolves to GitHub Pages and answers HTTP 200 with an unconfigured
  GitHub Pages HTML page for EVERY path, including all /.well-known/* paths. All of those
  200s are rejected as SPA/catch-all false positives (HTML bodies, identical byte sizes).
