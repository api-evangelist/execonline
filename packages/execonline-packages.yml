notes: |
  IMPORTANT — these are NOT API client SDKs. ExecOnline publishes no public API, so it
  publishes no client library for one. What the company does publish is CooperTS, a
  first-party open-source TypeScript ecosystem of Elm-inspired functional-programming
  utilities used to build its own React web application. Every package below is scoped
  to @execonline-inc on npm and sourced from github.com/execonline-inc/CooperTS.

  Because none of these is a client library for an ExecOnline API, this artifact carries
  a `Packages` pointer in apis.yml but deliberately does NOT carry an `SDKs` pointer.
  Emitting `SDKs` here would credit the ergonomics sdk_count check for something that is
  not an SDK for this provider's API.

  Registries probed with no first-party hit: PyPI (execonline -> 404), RubyGems (the two
  Ruby repos in the GitHub org, `memorb` and `restforce_mock`, are forks of gems owned by
  individual maintainers pjrebsch and ilyakatz, not ExecOnline-published packages),
  Maven Central, NuGet, pkg.go.dev, Packagist, crates.io.
